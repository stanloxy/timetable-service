# Стек задания: app + PostgreSQL + заглушка соседнего сервиса + брокер.
# Запуск — одной командой `docker compose up --build`, без .env: значения по умолчанию заданы ниже
# (`${VAR:-default}`), .env.example — справочник для локальных переопределений.
# Требования: Docker Compose v2.20+ (depends_on.required), buildx 0.17+ (BuildKit для сборки); `just doctor`.
#
# Приложение использует RabbitMQ. Kafka сохранена под отдельным профилем каркаса.
name: timetable-service

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://wa:wa@postgres:5432/wa}
  BROKER: ${BROKER:-rabbitmq}
  BROKER_URL: ${BROKER_URL:-amqp://wa:wa@rabbitmq:5672/}
  STUB_BASE_URL: ${STUB_BASE_URL:-http://people-stub:8100}
  STUB_TIMEOUT_MS: ${STUB_TIMEOUT_MS:-2000}
  TEST_MODE: ${TEST_MODE:-1}
  SEED_ON_START: ${SEED_ON_START:-0}
  JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      people-stub:
        condition: service_healthy
      rabbitmq:
        condition: service_started
        required: false
    healthcheck:
      # Liveness, не readiness: контейнер считается здоровым, пока процесс отвечает.
      # Готовность зависимостей (БД, брокер) проверяет gate через GET /health/ready.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa"]
      interval: 3s
      timeout: 3s
      retries: 20

  people-stub:
    build:
      context: ./stubs/people-stub
    ports:
      - "8100:8100"
    env_file:
      - ./stubs/people-stub/stub.env
    healthcheck:
      # /__stub/config не подчиняется режимам отказа: режим down моделирует отказ соседа, а не смерть процесса.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/__stub/config', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: wa
      RABBITMQ_DEFAULT_PASS: wa
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    ports:
      # Хост 9092 → listener EXTERNAL (29092 внутри контейнера); контейнеры ходят на kafka:9092 (INTERNAL).
      - "9092:29092"
    environment:
      # KRaft, один узел. Два listener'а: INTERNAL для сети compose (kafka:9092), EXTERNAL для хоста (localhost:9092).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
