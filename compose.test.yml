# Отдельный проект: запускать рецептами test-db-* из justfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Run just test-db-init}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?Run just test-db-init}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run just test-db-init}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  app-check:
    profiles: ["app-check"]
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:?Run just test-db-init}:${TEST_POSTGRES_PASSWORD:?Run just test-db-init}@postgres:5432/${TEST_POSTGRES_DB:?Run just test-db-init}
      TEST_MODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
